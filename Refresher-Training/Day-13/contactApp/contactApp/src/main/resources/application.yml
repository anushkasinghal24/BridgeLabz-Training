spring:
  application:
    name: contacts-app
  datasource:
    url: jdbc:h2:mem:contactsdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200,http://localhost:5173
  security:
    jwt:
      secret: ${APP_JWT_SECRET:contacts-app-secret-key-change-this-to-a-long-random-value}
      expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
    admin:
      username: ${APP_ADMIN_USERNAME:contactadmin}
      password: ${APP_ADMIN_PASSWORD:admin12345}
    user:
      username: ${APP_USER_USERNAME:contactuser}
      password: ${APP_USER_PASSWORD:user12345}
