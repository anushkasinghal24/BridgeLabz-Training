spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
  security:
    jwt:
      secret: ${APP_JWT_SECRET:contacts-app-secret-key-change-this-to-a-long-random-value}
      expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
    admin:
      username: ${APP_ADMIN_USERNAME:contactadmin}
      password: ${APP_ADMIN_PASSWORD:admin12345}
    user:
      username: ${APP_USER_USERNAME:contactuser}
      password: ${APP_USER_PASSWORD:user12345}
